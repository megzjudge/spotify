<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="alternate" href="https://spotify.jdge.cc" hreflang="en">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Megan Judge's Spotify Playlists & Podcasts</title>
  <meta name="description" content="Browse Megan Judge's live-updating Spotify playlists and podcast episodes. Explore curated music collections, listening statistics, podcast notes, and recently shared videos, updated directly from Spotify.">
  <meta name="author" content="Megan Judge">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#191414">
  <link rel="canonical" href="https://spotify.jdge.cc/">
  <meta property="og:title" content="Megan Judge's Spotify Playlists & Podcasts">
  <meta property="og:description" content="Browse Megan Judge's live-updating Spotify playlists and podcast episodes, complete with listening statistics, podcast notes, and curated collections.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_AU">
  <meta property="og:site_name" content="Megan Judge's Spotify Playlists & Podcasts">
  <meta property="og:url" content="https://spotify.jdge.cc/">
  <meta property="og:image" content="https://spotify.jdge.cc/images/playlists_icon.png">
  <meta property="og:image:alt" content="Megan Judge's Spotify Playlists">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Megan Judge's Spotify Playlists & Podcasts">
  <meta name="twitter:description" content="Browse Megan Judge's live-updating Spotify playlists and podcast episodes, complete with listening statistics, podcast notes, and curated collections.">
  <meta name="twitter:image" content="https://spotify.jdge.cc/images/playlists_icon.png">
  <meta name="twitter:image:alt" content="Megan Judge's Spotify Playlists">
  <meta name="keywords" content="Megan Judge Spotify, Spotify playlists, Spotify podcasts, podcast episodes, music playlists, curated playlists, listening statistics, podcast notes">
  <meta name="subject" content="Spotify Playlists and Podcast Browser">
  <link rel="icon" type="image/png" href="https://spotify.jdge.cc/images/playlists_icon.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Registered before the async SDK script below so there's no race on load order;
    // script.js awaits this promise whenever it needs the IFrame API.
    window.__spotifyIframeApiPromise = new Promise((resolve) => {
      window.onSpotifyIframeApiReady = (IFrameAPI) => resolve(IFrameAPI);
    });
  </script>
  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
  <script src="script.js" defer></script>
  <meta name="ahrefs-site-verification" content="10aa2570e946ca9e322eabb1533c51d3197e4e484ee12f2066a7b91688af232c">
</head>

<body>

  <header>
    <div class="container-header">
      <div class="brand">
        <h1>Megan Judge’s Spotify</h1>
      </div>

      <div class="refresh-control">
        <div class="refresh-control-row">
          <span class="refresh-progress-label" id="refreshProgressLabel" hidden>Pulling live data from Spotify…</span>
          <div class="refresh-progress" id="refreshProgress" aria-hidden="true">
            <div class="refresh-progress-bar" id="refreshProgressBar"></div>
          </div>
          <button id="refreshButton" class="primary-button" type="button">
            <span class="button-label-default">Refresh from Spotify</span>
            <span class="button-label-loading">Refreshing…</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main id="appMain"></main>

  <!-- Real Spotify playback (counts as an actual play), controlled entirely via JS.
       Lives outside #appMain so it survives every refresh's full re-render. -->
  <div class="spotify-popup-backdrop" id="spotifyPopupBackdrop" aria-hidden="true">
    <div class="spotify-popup">
      <button class="spotify-popup-close" id="spotifyPopupClose" type="button" aria-label="Close player">✕</button>
      <div id="spotifyEmbedHost"></div>
    </div>
  </div>

  <footer>
    <div class="container-footer">
      <p class="footer-left">
        Live data pulled from Spotify Web API via Cloudflare Pages Functions - <a href="https://github.com/megzjudge/spotify" target="_blank" rel="noopener noreferrer">Github</a>.
        Any song played on this website is recorded as a play on public Spotify.
      </p>
      <a class="footer-button" href="https://spotify.jdge.cc/api/auth/start" title="Mint a new Spotify refresh token">Token</a>
      <p class="footer-copy">© Megan Judge</p>
    </div>
  </footer>

</body>
</html>
